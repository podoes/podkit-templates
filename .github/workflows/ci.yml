name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/build.py --check

  # podkit's own reader is the judge of what an install can load: run it on the catalog.
  podkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          docker run --rm -v "$PWD:/catalog:ro" ghcr.io/podoes/podkit:main
          /bin/podkit check-templates /catalog

  pages:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - run: scripts/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
