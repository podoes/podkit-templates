version = 1

[projects.dev]
name = "Developer tools"

[projects.dev.environments.production]
name = "Production"

[projects.dev.environments.production.stacks.forgejo]
server = "${choose}"
source = "template:forgejo@16"
compose = '''
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    depends_on:
      - db
    environment:
      - USER_UID=${USER_UID}
      - USER_GID=${USER_GID}
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=forgejo
      - FORGEJO__server__DOMAIN=${FORGEJO_DOMAIN}
      - FORGEJO__server__SSH_DOMAIN=${FORGEJO_SSH_DOMAIN}
      - FORGEJO__server__ROOT_URL=https://${FORGEJO_DOMAIN}/
    restart: always
    expose:
      - 3000
      - 22
    volumes:
      - forgejo_server:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=forgejo
      - POSTGRES_DB=forgejo
    volumes:
      - forgejo_db:/var/lib/postgresql/data
volumes:
  forgejo_db:
    driver: local
  forgejo_server:
    driver: local
'''

[projects.dev.environments.production.stacks.forgejo.env]
FORGEJO_DOMAIN = "${secret:forgejo-hostname}"
FORGEJO_SSH_DOMAIN = "${secret:forgejo-hostname}"
USER_GID = "1000"
USER_UID = "1000"

[projects.dev.environments.production.stacks.code-server]
server = "${choose}"
source = "template:code-server@4.121.0"
compose = '''
services:
  code-server:
    image: codercom/code-server:4.121.0
    restart: unless-stopped
    expose:
      - 8080
    volumes:
      - code-server-home:/home/coder
    environment:
      - PASSWORD=${PASSWORD}
      - TZ=${TZ}
    user: "1000:1000"

volumes:
  code-server-home:
'''

[projects.dev.environments.production.stacks.code-server.env]
PASSWORD = "${secret:code-server-password}"
TZ = "UTC"

[projects.dev.environments.production.stacks.it-tools]
server = "${choose}"
source = "template:it-tools@latest"
compose = '''
services:
  it-tools:
    image: corentinth/it-tools:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
'''
