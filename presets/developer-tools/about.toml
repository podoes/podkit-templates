name = "Developer tools"
description = "A developer's own corner: Forgejo hosts the code, code-server is an editor in the browser for the machine you are not sitting at, and IT-Tools has the converters and generators you would otherwise search for. After applying, route a hostname to each on its page. code-server asks for a password that podkit makes up: read it as PASSWORD in the stack's variables."
