version = 1

[projects.planning]
name = "Team planning"

[projects.planning.environments.production]
name = "Production"

[projects.planning.environments.production.stacks.docmost]
server = "${choose}"
source = "template:docmost@0.4.1"
compose = '''
services:
  docmost:
    image: docmost/docmost:0.4.1
    depends_on:
      - db
      - redis
    environment:
      - APP_URL
      - APP_SECRET
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped

    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    restart: unless-stopped

    volumes:
      - db_docmost_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped

    volumes:
      - redis_docmost_data:/data

volumes:
  docmost:
  db_docmost_data:
  redis_docmost_data:
'''

[projects.planning.environments.production.stacks.docmost.env]
APP_SECRET = "${generate:docmost-app-secret}"
APP_URL = "http://${secret:docmost-hostname}:3000"
POSTGRES_DB = "docmost"
POSTGRES_PASSWORD = "${generate:docmost-postgres-password}"
POSTGRES_USER = "docmost"

[projects.planning.environments.production.stacks.nocodb]
server = "${choose}"
source = "template:nocodb@latest"
compose = '''
services:
  nocodb:
    image: nocodb/nocodb:latest
    restart: always
    depends_on:
      root_db:
        condition: service_healthy
    environment:
      # Reuses DB env from template.toml / .env
      NC_DB: "pg://root_db:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}"
    volumes:
      - nc_data:/usr/app/data

  root_db:
    image: postgres:16.6
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # More reliable healthcheck:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"',
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: {}
  nc_data: {}
'''

[projects.planning.environments.production.stacks.nocodb.env]
POSTGRES_DB = "root_db"
POSTGRES_PASSWORD = "${generate:nocodb-postgres-password}"
POSTGRES_USER = "postgres"

[projects.planning.environments.production.stacks.kimai]
server = "${choose}"
source = "template:kimai@2.31.0"
compose = '''
services:
  app:
    image: kimai/kimai2:apache-2.31.0
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DATABASE_URL: mysql://kimai:${KI_MYSQL_PASSWORD:-kimai}@db/kimai
      TRUSTED_PROXIES: localhost
      APP_SECRET: ${KI_APP_SECRET}
      MAILER_FROM: ${KI_MAILER_FROM:-admin@kimai.local}
      MAILER_URL: ${KI_MAILER_URL:-null://null}
      ADMINMAIL: ${KI_ADMINMAIL:-admin@kimai.local}
      ADMINPASS: ${KI_ADMINPASS}
    volumes:
      - kimai-data:/opt/kimai/var
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=kimai
      - MYSQL_USER=kimai
      - MYSQL_PASSWORD=${KI_MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${KI_MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-flush-log-at-trx-commit=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kimai", "-p${KI_MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  kimai-data:
  mysql-data:
'''

[projects.planning.environments.production.stacks.kimai.env]
KI_ADMINMAIL = "admin@kimai.local"
KI_ADMINPASS = "${generate:kimai-admin-password}"
KI_APP_SECRET = "${generate:kimai-app-secret}"
KI_HOST = "${secret:kimai-hostname}"
KI_MYSQL_PASSWORD = "${generate:kimai-mysql-password}"
KI_MYSQL_ROOT_PASSWORD = "${generate:kimai-mysql-root-password}"
